# Render Deployment Blueprint for LabangOnline
services:
  - type: web
    name: labangonline-backend
    env: docker
    plan: free
    branch: main
    dockerContext: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: DB_URL
        sync: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME
        sync: postgres.ashaantifmdzgtyeoibh
      - key: DB_PASSWORD
        sync: Lenonlee@7312005
      - key: FRONTEND_URL
        sync: false # Input this in Render (e.g. https://labangonline-web.onrender.com)

  - type: static
    name: labangonline-web
    env: node
    plan: free
    branch: main
    buildCommand: cd web && npm install && npm run build
    publishPath: web/dist
    envVars:
      - key: VITE_API_URL
        value: https://labangonline-backend.onrender.com/api/
