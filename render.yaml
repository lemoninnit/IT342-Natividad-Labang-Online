    name: labangonline-backend
    env: java
    plan: free
    branch: main
    buildCommand: ./backend/mvnw -f backend/pom.xml clean package
    startCommand: java -jar backend/target/labangonline-1.0.0.jar
    envVars:
      - key: FRONTEND_URL
        value: https://<YOUR_FRONTEND_SERVICE>.onrender.com
