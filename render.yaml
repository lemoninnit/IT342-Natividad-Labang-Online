# Render Deployment Blueprint for ServiLine
services:
  - type: web
    name: serviline-backend
    env: docker
    plan: free
    branch: main
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://ep-damp-leaf-aojinylb.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_RmiAFIsN0W3Z
      - key: FRONTEND_URL
        sync: false # Input this in Render (e.g. https://serviline-web.onrender.com)

  - type: web
    name: serviline-web
    env: static
    plan: free
    branch: main
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        value: https://serviline.onrender.com/api/
