# ============================================================
# LabangOnline Backend - application.properties
# Location: backend/src/main/resources/application.properties
# ============================================================

spring.application.name=labangonline-backend

# ── Neon PostgreSQL Connection ──
# Neon provides a managed Postgres database. Connection string is in JDBC format.
# Format: postgresql://<user>:<password>@<host>/<database>?sslmode=require&channel_binding=require
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-orange-recipe-a15ake7l-pooler.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_Q73ynlxzHkRT}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Server ──
server.port=8080

# ── CORS ──
# Set FRONTEND_URL in the environment when deployed (e.g. https://your-frontend.onrender.com)
frontend.url=${FRONTEND_URL:http://localhost:5173}
