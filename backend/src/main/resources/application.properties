spring.application.name=labangonline-backend

# ── Neon PostgreSQL Connection ──
# Neon provides a managed Postgres database. Connection string is in JDBC format.
# Format: postgresql://<user>:<password>@<host>/<database>?sslmode=require&channel_binding=require
spring.datasource.url=jdbc:postgresql://ep-orange-recipe-a15ake7l-pooler.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_Q73ynlxzHkRT
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Server ──
server.port=8080

# ── CORS ──
frontend.url=http://localhost:5173

