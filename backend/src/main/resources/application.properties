spring.application.name=labangonline-backend

# ── Supabase PostgreSQL Connection ──
# Supabase gives you a direct Postgres connection
# Format: jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres
spring.datasource.url=jdbc:postgresql://db.sncglvftcsndaayvmkbw.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=SakaiMoka@2004
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Server ──
server.port=8080

# ── CORS ──
frontend.url=http://localhost:5173

